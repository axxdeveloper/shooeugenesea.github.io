<div class="sidebar-calendar" data-post-date="{{ page.date | date: '%Y-%m-%d' }}">
  <div class="sidebar-calendar__header">
    <button class="sidebar-calendar__nav" id="cal-prev" aria-label="Previous month">&lsaquo;</button>
    <span class="sidebar-calendar__title" id="cal-title"></span>
    <button class="sidebar-calendar__nav" id="cal-next" aria-label="Next month">&rsaquo;</button>
  </div>
  <table class="sidebar-calendar__table">
    <thead>
      <tr>
        <th>Su</th><th>Mo</th><th>Tu</th><th>We</th><th>Th</th><th>Fr</th><th>Sa</th>
      </tr>
    </thead>
    <tbody id="cal-body">
    </tbody>
  </table>
</div>
