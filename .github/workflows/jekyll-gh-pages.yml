name: Deploy student resources to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify study question keys
        run: |
          node tests/study/check-bank.cjs
          node tests/study/check-extra.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage only public student resources
        run: |
          set -euo pipefail
          mkdir -p _site/study/fraction-division
          cp CNAME index.html 404.html robots.txt sitemap.xml _site/
          cp study/index.html study/app.js study/questions.js study/extra.js _site/study/
          cp study/fraction-division/index.html _site/study/fraction-division/
          test "$(find _site -type f | wc -l)" -eq 10
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
